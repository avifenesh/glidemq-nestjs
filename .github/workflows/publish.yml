name: Publish to npm

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.2.1)"
        required: true
      publish:
        description: "Publish to NPM"
        required: true
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8.0
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Check release workflow
        run: node --test scripts/npm-release-checks.mjs

      - name: Audit all dependencies
        run: npm audit --include=dev --audit-level=low

      - run: npm test

      - run: npm run build

      - name: Set version
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version $VERSION --no-git-tag-version
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        run: node scripts/npm-release.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_seconds: 15
          max_attempts: 30
          retry_wait_seconds: 20
          retry_on_exit_code: 75
          command: node scripts/npm-release.mjs verify
